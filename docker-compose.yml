# Full stack: `docker compose up --build` runs Postgres + the NestJS API + the Next.js web.
# For API development run `docker compose up -d postgres` and `pnpm dev` on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      # Override POSTGRES_PORT if 5432 is taken by a local Postgres.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanban -d kanban']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:3002
      APP_URL: http://localhost:3002
      DATABASE_URL: postgresql://kanban:kanban@postgres:5432/kanban
      # Enables the Socket.IO Redis adapter so the gateway scales across instances.
      REDIS_URL: redis://redis:6379
      # Dev-only default so `docker compose up` just works; set JWT_SECRET in your
      # shell or an .env file for anything real.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # Stripe is optional — leave these unset to run the keyless mock billing provider.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - '3002:3002'
    depends_on:
      - api

volumes:
  pgdata:
